services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medrobots}
      POSTGRES_USER: ${POSTGRES_USER:-medrobots}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medrobots_local_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medrobots} -d ${POSTGRES_DB:-medrobots}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./services/medrobots-api
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-medrobots}:${POSTGRES_PASSWORD:-medrobots_local_change_me}@db:5432/${POSTGRES_DB:-medrobots}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: ./services/medrobots-api
    environment:
      APP_NAME: Med Robots API
      APP_VERSION: 0.1.0
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-medrobots}:${POSTGRES_PASSWORD:-medrobots_local_change_me}@db:5432/${POSTGRES_DB:-medrobots}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./services/paulositecopy:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000}
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:
